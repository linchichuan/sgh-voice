name: Windows 2.7.6 — supervised source diagnosis

on:
  push:
    branches: [codex/windows-ci-diagnose-20261005]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.repository == 'linchichuan/sgh-voice' && github.event.created && !github.event.deleted && github.run_attempt == '1'
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install the existing hash-pinned Windows dependencies
        shell: pwsh
        timeout-minutes: 3
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-windows-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Supervise all Windows source tests and report fatal traces
        shell: pwsh
        timeout-minutes: 4
        run: ./windows/diagnose-tests.ps1
