name: Windows installer (manual, unsigned)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Standard public-repository runner only; never opt into larger/paid runners.
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install pinned build dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-windows-build.txt
      - name: Check Windows source and release contracts with Ruff
        shell: pwsh
        timeout-minutes: 3
        run: |
          $Tests = @(Get-ChildItem tests/test_windows*.py | ForEach-Object FullName)
          if (-not $Tests.Count) { throw 'Windows tests missing' }
          python -m ruff check windows_launcher.py windows_client scripts/verify_windows_release.py @Tests --select E9,F63,F7,F82
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Supervise Windows source tests with durable hang diagnostics
        shell: pwsh
        timeout-minutes: 4
        run: ./windows/diagnose-tests.ps1
      - name: Build and self-test unsigned installer
        shell: pwsh
        run: ./windows/build.ps1
      - name: Exercise bundled offline CPU inference
        shell: pwsh
        timeout-minutes: 5
        run: ./windows/offline-test.ps1
      - name: Install, self-test and uninstall
        shell: pwsh
        timeout-minutes: 5
        run: ./windows/install-test.ps1
      - name: Record limited verification scope
        shell: pwsh
        run: |
          'Unsigned test build only. No release or website deployment occurred. Physical microphone, global hotkey, target paste, standard-user Windows 10/11 and OS security acceptance remain NOT RUN.' >> $env:GITHUB_STEP_SUMMARY
